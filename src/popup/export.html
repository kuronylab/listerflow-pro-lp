<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="exportPageTitle">Spreadsheet Export - ListerFlow Pro</title>
  <link rel="stylesheet" href="export.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title" data-i18n="exportTitle">Spreadsheet Export</h1>
      <div class="actions">
        <button id="copyTwoColumnsBtn" class="btn-copy" data-i18n="exportCopyTwoColumns">
          <span class="icon">📋</span> 日付の2列をコピー
        </button>
        <button id="downloadCsvBtn" class="btn-csv" data-i18n="exportDownloadCsv">
          <span class="icon">📥</span> CSVダウンロード
        </button>
      </div>
    </div>

    <div class="table-container">
      <table id="historyTable">
        <thead>
          <tr>
            <th data-i18n="csvHeaderAsin">ASINコード</th>
            <th data-i18n="csvHeaderResult">結果</th>
            <th data-i18n="csvHeaderListedDate">出品日</th>
            <th data-i18n="csvHeaderErrorDate">エラーにより出品不可</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <!-- データの挿入箇所 -->
        </tbody>
      </table>
    </div>
  </div>
  <script src="export.js"></script>
</body>
</html>
